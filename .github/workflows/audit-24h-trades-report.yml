name: audit-24h-trades-report
on:
  push:
    branches:
      - staging/challenge1-integration-2026-11-16
    paths:
      - "scripts/audit_24h_trades_report.py"
      - ".github/workflows/audit-24h-trades-report.yml"
permissions:
  contents: read
concurrency:
  group: csr-audit-24h-${{ github.ref }}
  cancel-in-progress: false
jobs:
  read-only-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
      TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
      BLOFIN_DEMO_TRADE_API_KEY: ${{ secrets.BLOFIN_DEMO_TRADE_API_KEY }}
      BLOFIN_DEMO_TRADE_API_SECRET: ${{ secrets.BLOFIN_DEMO_TRADE_API_SECRET }}
      BLOFIN_DEMO_TRADE_PASSPHRASE: ${{ secrets.BLOFIN_DEMO_TRADE_PASSPHRASE }}
      BLOFIN_API_KEY: ${{ secrets.BLOFIN_DEMO_TRADE_API_KEY }}
      BLOFIN_API_SECRET: ${{ secrets.BLOFIN_DEMO_TRADE_API_SECRET }}
      BLOFIN_PASSPHRASE: ${{ secrets.BLOFIN_DEMO_TRADE_PASSPHRASE }}
      BLOFIN_DEMO_API_KEY: ${{ secrets.BLOFIN_DEMO_API_KEY }}
      BLOFIN_DEMO_API_SECRET: ${{ secrets.BLOFIN_DEMO_API_SECRET }}
      BLOFIN_DEMO_PASSPHRASE: ${{ secrets.BLOFIN_DEMO_PASSPHRASE }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Run read-only 24h audit
        run: |
          set -euo pipefail
          mkdir -p audit-output
          python scripts/audit_24h_trades_report.py | tee audit-output/audit-24h-report.json
      - name: Upload sanitized audit report
        uses: actions/upload-artifact@v4
        with:
          name: audit-24h-trades-report-${{ github.run_id }}
          path: audit-output/audit-24h-report.json
          if-no-files-found: error
          retention-days: 14
