name: BloFin Demo AI synthetic dry-run

on:
  push:
    branches:
      - feature/blofin-demo-adapter
    paths:
      - .github/workflows/blofin-demo-ai-dry-run.yml

permissions:
  contents: read

concurrency:
  group: blofin-demo-ai-synthetic-dry-run
  cancel-in-progress: false

jobs:
  ai-dry-run:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Call the real Demo AI validator with synthetic-only evidence
        env:
          DEMO_URL: https://crypto-super-radar-blofin-demo.onrender.com
        shell: bash
        run: |
          set -euo pipefail
          response_file="$RUNNER_TEMP/ai-dry-run.json"
          http_code="$(curl --silent --show-error --location \
            --connect-timeout 10 --max-time 150 \
            --output "$response_file" --write-out '%{http_code}' \
            --request POST "$DEMO_URL/api/ai/dry-run" \
            --header "Origin: $DEMO_URL" \
            --header "Sec-Fetch-Site: same-origin" \
            --header "Content-Type: application/x-www-form-urlencoded" \
            --data 'confirm=1')"
          python - "$http_code" "$response_file" <<'PY'
          import json
          import pathlib
          import sys

          status_code = int(sys.argv[1])
          payload = json.loads(pathlib.Path(sys.argv[2]).read_text(encoding="utf-8"))
          safe = {
              "http_status": status_code,
              "provider": payload.get("provider"),
              "model": payload.get("model"),
              "status": payload.get("status"),
              "test_mode": payload.get("test_mode"),
              "test_passed": payload.get("test_passed"),
              "response_validated": payload.get("response_validated"),
              "model_verified": payload.get("model_verified"),
              "paper_entry_eligible": payload.get("paper_entry_eligible"),
              "orders_submitted": payload.get("orders_submitted"),
              "trade_executed": payload.get("trade_executed"),
              "cost_usd": payload.get("cost_usd"),
          }
          print(json.dumps(safe, ensure_ascii=False, indent=2))
          if status_code != 200 or payload.get("test_passed") is not True:
              raise SystemExit("AI synthetic dry-run did not pass; no order was submitted.")
          if payload.get("input_data") != "SYNTHETIC_NOT_LIVE_MARKET":
              raise SystemExit("Unexpected input source; refusing to treat this as a synthetic test.")
          if payload.get("paper_entry_eligible") is not False:
              raise SystemExit("Synthetic test must never be marked eligible for a real Demo entry.")
          if payload.get("orders_submitted") is not False or payload.get("trade_executed") is not False:
              raise SystemExit("Synthetic test unexpectedly reports an order or trade.")
          PY
