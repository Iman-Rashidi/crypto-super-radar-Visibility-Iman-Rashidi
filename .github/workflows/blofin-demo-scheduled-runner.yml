name: BloFin Demo scheduled runner

on:
  schedule:
    - cron: "2-57/5 * * * *"
  workflow_dispatch:
    inputs:
      confirm_demo_cycle:
        description: "Run one Challenge 1 batch on BloFin Demo"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: csr-blofin-demo-challenge1
  cancel-in-progress: false

jobs:
  demo-cycle:
    if: >-
      github.repository == 'Iman-Rashidi/crypto-super-radar-Visibility-Iman-Rashidi' &&
      vars.BLOFIN_DEMO_TRADING_ENABLED == 'true' &&
      vars.BLOFIN_DEMO_AUTOPILOT_ENABLED == 'true' &&
      (github.event_name == 'schedule' || inputs.confirm_demo_cycle == true)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      BLOFIN_DEMO_AUTOPILOT_ROLE: WORKER
      BLOFIN_DEMO_TRADING_ENABLED: ${{ vars.BLOFIN_DEMO_TRADING_ENABLED }}
      BLOFIN_DEMO_AUTOPILOT_ENABLED: ${{ vars.BLOFIN_DEMO_AUTOPILOT_ENABLED }}
      BLOFIN_DEMO_AUTOPILOT_INTERVAL_SECONDS: "300"
      BLOFIN_DEMO_AUTOPILOT_INSTRUMENTS: "BTC-USDT,ETH-USDT,SOL-USDT,XRP-USDT,LINK-USDT"
      BLOFIN_DEMO_SMOKE_TEST_ENABLED: "false"
      TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
      TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
      BLOFIN_DEMO_API_KEY: ${{ secrets.BLOFIN_DEMO_API_KEY }}
      BLOFIN_DEMO_API_SECRET: ${{ secrets.BLOFIN_DEMO_API_SECRET }}
      BLOFIN_DEMO_PASSPHRASE: ${{ secrets.BLOFIN_DEMO_PASSPHRASE }}
      BLOFIN_DEMO_TRADE_API_KEY: ${{ secrets.BLOFIN_DEMO_TRADE_API_KEY }}
      BLOFIN_DEMO_TRADE_API_SECRET: ${{ secrets.BLOFIN_DEMO_TRADE_API_SECRET }}
      BLOFIN_DEMO_TRADE_PASSPHRASE: ${{ secrets.BLOFIN_DEMO_TRADE_PASSPHRASE }}
      BLOFIN_DASHBOARD_TOKEN: ${{ secrets.BLOFIN_DASHBOARD_TOKEN }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      CSR_OPENROUTER_API_KEY: ${{ secrets.CSR_OPENROUTER_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Checkout the validated Staging code
        uses: actions/checkout@v4
        with:
          ref: staging/challenge1-integration-2026-11-16

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Build the exact Render-compatible source bundle
        shell: bash
        run: |
          set -euo pipefail
          python scripts/rebuild_source_archive.py
          mkdir -p "$RUNNER_TEMP/csr"
          tar -xJf dist/crypto-super-radar-source.tar.xz -C "$RUNNER_TEMP/csr"
          mkdir -p "$RUNNER_TEMP/csr/crypto-super-radar/crypto_super_radar"
          cp -R crypto_super_radar/. "$RUNNER_TEMP/csr/crypto-super-radar/crypto_super_radar/"
          cp README.md pyproject.toml requirements.txt "$RUNNER_TEMP/csr/crypto-super-radar/"

      - name: Install runtime dependencies
        working-directory: ${{ runner.temp }}/csr/crypto-super-radar
        run: python -m pip install --no-input -r requirements.txt

      - name: Run one guarded multi-symbol Demo cycle
        working-directory: ${{ runner.temp }}/csr/crypto-super-radar
        run: python -m crypto_super_radar.demo_autopilot_once
