name: Challenge 1 V2 Demo autopilot worker
# Post-deploy Staging validation after Render bundle d17b44a (Groq model update).
# Post-deploy Staging validation trigger; no runtime behavior change.

on:
  push:
    branches:
      - staging/challenge1-integration-2026-11-16
    paths:
      - .github/workflows/challenge1-v2-demo-autopilot.yml
      - crypto_super_radar/ai_second_opinion.py
      - crypto_super_radar/ai_supervisor.py
      - crypto_super_radar/blofin_demo_executor.py
      - crypto_super_radar/challenge1_v2.py
      - crypto_super_radar/challenge1_v2_autopilot.py
      - crypto_super_radar/challenge1_v2_orchestration.py
      - crypto_super_radar/ai_supervisor.py
      - crypto_super_radar/ai_second_opinion.py
      - crypto_super_radar/telegram_notifier.py
      - tests/test_ai_second_opinion.py
      - tests/test_ai_supervisor.py
      - tests/test_blofin_demo_executor.py
      - tests/test_challenge1_v2_autopilot.py
      - tests/test_telegram_notifier.py
      - tests/test_challenge1_v2_supervisor_failover.py
      - tests/test_challenge1_v2_web_orchestration.py
  # GitHub scheduled workflows are evaluated only from the repository default branch.
  # This Staging worker is manually dispatchable; the default-branch scheduler is intentionally untouched.
  workflow_dispatch:
    inputs:
      confirm_demo_execution:
        description: 'Set YES to authorize exactly one guarded BloFin Demo cycle.'
        required: true
        type: choice
        options:
          - NO
          - YES
        default: NO

permissions:
  contents: read

concurrency:
  group: challenge1-v2-demo-autopilot
  cancel-in-progress: false

jobs:
  v2-demo-cycle:
    # Pushes (including this configuration commit) never place orders. A manual run needs explicit YES.
    if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.confirm_demo_execution == 'YES' && vars.CHALLENGE_1_V2_DEMO_AUTOPILOT_ENABLED != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN || secrets.CSR_TELEGRAM_BOT_TOKEN }}
      CSR_TELEGRAM_BOT_TOKEN: ${{ secrets.CSR_TELEGRAM_BOT_TOKEN || secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID || secrets.CSR_TELEGRAM_CHAT_ID }}
      CSR_TELEGRAM_CHAT_ID: ${{ secrets.CSR_TELEGRAM_CHAT_ID || secrets.TELEGRAM_CHAT_ID }}
      CHALLENGE_1_V2_DEMO_AUTOPILOT_ENABLED: ${{ vars.CHALLENGE_1_V2_DEMO_AUTOPILOT_ENABLED || 'true' }}
      # Easy Demo V2 worker may open entries under the four-slot executor cap; exit management remains active every cycle.
      CHALLENGE_1_V2_MANAGE_ONLY: "false"
      CHALLENGE_1_V2_LEVERAGE: '1'
      TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
      TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
      BLOFIN_DEMO_TRADING_ENABLED: ${{ vars.BLOFIN_DEMO_TRADING_ENABLED || 'true' }}
      # Context-only entry relaxations are scoped to this Demo worker; risk, Groq, SL/TP and exits remain hard gates.
      CHALLENGE_1_V2_EASY_DEMO_ENTRY_MODE: 'true'
      # Legacy V1 and smoke-test paths remain disabled.
      BLOFIN_DEMO_AUTOPILOT_ENABLED: 'false'
      BLOFIN_DEMO_SMOKE_TEST_ENABLED: 'false'
      BLOFIN_DEMO_TRADE_API_KEY: ${{ secrets.BLOFIN_DEMO_TRADE_API_KEY }}
      BLOFIN_DEMO_TRADE_API_SECRET: ${{ secrets.BLOFIN_DEMO_TRADE_API_SECRET }}
      BLOFIN_DEMO_TRADE_PASSPHRASE: ${{ secrets.BLOFIN_DEMO_TRADE_PASSPHRASE }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
    steps:
      - name: Checkout the Staging implementation only
        uses: actions/checkout@v4
        with:
          ref: staging/challenge1-integration-2026-11-16
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Compile V2 worker and safety controls
        run: |
          python -m compileall -q crypto_super_radar/challenge1_v2_autopilot.py crypto_super_radar/challenge1_v2_orchestration.py crypto_super_radar/challenge1_v2.py crypto_super_radar/challenge1_v2_trade_controls.py tests/test_challenge1_v2_autopilot.py tests/test_challenge1_v2_funding.py tests/test_challenge1_v2_trade_controls.py tests/test_challenge1_v2_supervisor_failover.py tests/test_challenge1_v2_entry_rule.py
      - name: Run V2 worker and trade-control tests
        env:
          # Unit tests must isolate themselves from the live worker's manager-only runtime flags.
          BLOFIN_DEMO_TRADING_ENABLED: 'false'
          CHALLENGE_1_V2_MANAGE_ONLY: 'false'
        run: |
          python -m unittest discover -s tests -p 'test_challenge1_v2_autopilot.py' -v
          python -m unittest discover -s tests -p 'test_challenge1_v2_supervisor_failover.py' -v
          python -m unittest discover -s tests -p 'test_challenge1_v2_entry_rule.py' -v
          python -m unittest discover -s tests -p 'test_challenge1_v2_funding.py' -v
          python -m unittest discover -s tests -p 'test_challenge1_v2_trade_controls.py' -v
          python -m unittest discover -s tests -p 'test_challenge1_v2_web_orchestration.py' -v
      - name: Execute full guarded BloFin Demo V2 cycle and persist to Turso
        env:
          BLOFIN_DEMO_TRADING_ENABLED: ${{ vars.BLOFIN_DEMO_TRADING_ENABLED || 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP"
          set +e
          python -m crypto_super_radar.challenge1_v2_autopilot | tee "$RUNNER_TEMP/challenge1-v2-cycle.json"
          worker_exit=${PIPESTATUS[0]}
          set -e
          cycle_status="$(python -c 'import json,sys; print(json.load(open(sys.argv[1], encoding="utf-8")).get("status", ""))' "$RUNNER_TEMP/challenge1-v2-cycle.json")"
          if [[ "$cycle_status" == "CYCLE_PARTIAL" && "$worker_exit" -eq 3 ]]; then
            echo "CYCLE_PARTIAL is a valid no-entry/partial market outcome; infrastructure and persistence checks continue."
            exit 0
          fi
          if [[ "$worker_exit" -ne 0 ]]; then
            echo "V2 worker failed technically (exit=$worker_exit, status=$cycle_status)." >&2
            exit "$worker_exit"
          fi
      - name: Read back and verify the five Turso cycle records
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from crypto_super_radar.database import connect_database, storage_backend
          with open("${{ runner.temp }}/challenge1-v2-cycle.json", encoding="utf-8") as handle:
              cycle = json.load(handle)
          if storage_backend() != "TURSO_CLOUD_SQLITE":
              raise SystemExit("Turso backend is not active")
          cycle_id = str(cycle.get("cycle_id") or "")
          if not cycle_id:
              raise SystemExit("Cycle ID is missing from the report")
          connection = connect_database()
          try:
              row = connection.execute(
                  "SELECT COUNT(*) FROM challenge1_v2_autopilot_cycles WHERE cycle_id = ?",
                  (cycle_id,),
              ).fetchone()
              count = int(row[0]) if row else 0
              print(json.dumps({"cycle_id": cycle_id, "turso_rows": count, "expected_rows": 5}))
              if count != 5:
                  raise SystemExit("Turso cycle read-back did not return exactly five symbol records")
          finally:
              connection.close()
          PY
      # Render dashboard publishing is deliberately omitted: the Worker persists directly to Turso.
      - name: Upload non-secret V2 cycle report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: challenge1-v2-demo-run-${{ github.run_id }}
          path: ${{ runner.temp }}/challenge1-v2-cycle.json
          if-no-files-found: ignore
          retention-days: 7

