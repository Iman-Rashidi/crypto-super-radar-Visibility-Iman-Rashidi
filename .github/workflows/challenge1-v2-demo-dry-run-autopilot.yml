name: Challenge 1 V2 Demo autopilot worker

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: challenge1-v2-demo-autopilot
  cancel-in-progress: false

jobs:
  v2-demo-cycle:
    # Enabled by default; explicit false remains the kill switch.
    if: ${{ vars.CHALLENGE_1_V2_DEMO_AUTOPILOT_ENABLED != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CHALLENGE_1_V2_DEMO_AUTOPILOT_ENABLED: ${{ vars.CHALLENGE_1_V2_DEMO_AUTOPILOT_ENABLED || 'true' }}
      TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
      TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
      BLOFIN_DEMO_TRADING_ENABLED: ${{ vars.BLOFIN_DEMO_TRADING_ENABLED || 'true' }}
      # Legacy V1 and smoke-test paths remain disabled.
      BLOFIN_DEMO_AUTOPILOT_ENABLED: 'false'
      BLOFIN_DEMO_SMOKE_TEST_ENABLED: 'false'
      BLOFIN_DEMO_TRADE_API_KEY: ${{ secrets.BLOFIN_DEMO_TRADE_API_KEY }}
      BLOFIN_DEMO_TRADE_API_SECRET: ${{ secrets.BLOFIN_DEMO_TRADE_API_SECRET }}
      BLOFIN_DEMO_TRADE_PASSPHRASE: ${{ secrets.BLOFIN_DEMO_TRADE_PASSPHRASE }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
    steps:
      - name: Checkout the Staging implementation only
        uses: actions/checkout@v4
        with:
          ref: staging/challenge1-integration-2026-11-16
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Compile V2 worker and safety controls
        run: |
          python -m compileall -q crypto_super_radar/challenge1_v2_autopilot.py crypto_super_radar/challenge1_v2_orchestration.py crypto_super_radar/challenge1_v2.py crypto_super_radar/challenge1_v2_trade_controls.py tests/test_challenge1_v2_autopilot.py tests/test_challenge1_v2_trade_controls.py
      - name: Run V2 worker and trade-control tests
        run: |
          python -m unittest discover -s tests -p 'test_challenge1_v2_autopilot.py' -v
          python -m unittest discover -s tests -p 'test_challenge1_v2_trade_controls.py' -v
          python -m unittest discover -s tests -p 'test_challenge1_v2_web_orchestration.py' -v
      - name: Execute full guarded BloFin Demo V2 cycle and persist to Turso
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP"
          python -m crypto_super_radar.challenge1_v2_autopilot | tee "$RUNNER_TEMP/challenge1-v2-cycle.json"
      - name: Upload non-secret V2 cycle report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: challenge1-v2-demo-run-${{ github.run_id }}
          path: ${{ runner.temp }}/challenge1-v2-cycle.json
          if-no-files-found: ignore
          retention-days: 7
