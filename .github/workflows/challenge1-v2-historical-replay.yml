name: challenge1-v2-historical-replay

on:
  push:
    branches:
      - ops/challenge1-v2-historical-replay

permissions:
  contents: read

concurrency:
  group: challenge1-v2-historical-replay
  cancel-in-progress: false

jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout isolated replay branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install free runner dependencies
        run: python -m pip install --disable-pip-version-check numpy pandas requests "websockets>=12.0"

      - name: Compile replay modules
        run: |
          python -m compileall -q \
            crypto_super_radar/market_replay.py \
            crypto_super_radar/ai_sandbox.py \
            crypto_super_radar/virtual_blofin.py \
            crypto_super_radar/challenge1_v2.py \
            crypto_super_radar/adaptive_brain.py \
            crypto_super_radar/challenge1_event_queue.py \
            crypto_super_radar/challenge1_sandbox_worker.py \
            crypto_super_radar/ai_second_opinion.py \
            crypto_super_radar/challenge1_position_observers.py \
            scripts/diagnose_blofin_funding_history.py \
            crypto_super_radar/providers.py \
            scripts/live_provider_acceptance.py \
            tests/test_provider_quality.py \
            tests/test_live_provider_acceptance.py \
            tests/test_funding_history_diagnostic.py \
            scripts/diagnose_blofin_market_data.py \
            tests/test_challenge1_event_queue.py \
            tests/test_challenge1_sandbox_worker.py \
            tests/test_blofin_demo_executor.py \
            tests/test_ai_second_opinion.py \
            crypto_super_radar/blofin_demo_futures_ws.py \
            scripts/live_blofin_demo_ws_acceptance.py \
            tests/test_blofin_demo_futures_ws.py \
            tests/test_live_blofin_demo_ws_acceptance.py \
            tests/test_challenge1_position_observers.py

      - name: Run V2 regression and duplicate-timestamp tests
        run: |
          python -m unittest discover -s tests -p 'test_challenge1_v2_time_exit_and_lookahead.py' -v
          python -m unittest discover -s tests -p 'test_challenge1_v2_risk_brain_replay.py' -v
          python -m unittest discover -s tests -p 'test_market_replay_duplicates.py' -v
          python -m unittest discover -s tests -p 'test_funding_history_diagnostic.py' -v
          python -m unittest discover -s tests -p 'test_live_provider_acceptance.py' -v
          python -m unittest discover -s tests -p 'test_provider_quality.py' -v
          python -m unittest discover -s tests -p 'test_challenge1_event_queue.py' -v
          python -m unittest discover -s tests -p 'test_challenge1_sandbox_worker.py' -v
          python -m unittest discover -s tests -p 'test_blofin_demo_executor.py' -v
          python -m unittest discover -s tests -p 'test_ai_second_opinion.py' -v
          python -m unittest discover -s tests -p 'test_challenge1_position_observers.py' -v
          python -m unittest discover -s tests -p 'test_blofin_demo_futures_ws.py' -v
          python -m unittest discover -s tests -p 'test_live_blofin_demo_ws_acceptance.py' -v

      - name: Diagnose Demo funding histories and compare Production schema only
        id: funding-diagnostic
        continue-on-error: true
        run: |
          set +e
          mkdir -p artifacts
          python -m scripts.diagnose_blofin_funding_history --all --months 7 \
            --compare-production-schema \
            > artifacts/funding_diagnostic.json 2> artifacts/funding_diagnostic.stderr
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          if [ "$code" -ne 0 ]; then
            tail -n 100 artifacts/funding_diagnostic.stderr >> "$GITHUB_STEP_SUMMARY" || true
          else
            cat artifacts/funding_diagnostic.json >> "$GITHUB_STEP_SUMMARY"
          fi
          exit 0

      - name: Validate and persist real market data for all five symbols
        id: market-data-diagnostic
        continue-on-error: true
        run: |
          set +e
          mkdir -p artifacts
          python -m scripts.diagnose_blofin_market_data \
            --months 7 \
            --db artifacts/market_data_diagnostic.sqlite3 \
            --report artifacts/market_data_diagnostic.json \
            > artifacts/market_data_diagnostic.log 2>&1
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          if [ -f artifacts/market_data_diagnostic.json ]; then
            cat artifacts/market_data_diagnostic.json >> "$GITHUB_STEP_SUMMARY"
          else
            tail -n 100 artifacts/market_data_diagnostic.log >> "$GITHUB_STEP_SUMMARY" || true
          fi
          exit 0

      - name: Run read-only five-symbol provider acceptance
        id: provider_acceptance
        continue-on-error: true
        run: |
          set +e
          mkdir -p artifacts
          python -m scripts.live_provider_acceptance --all-symbols \
            --output artifacts/live_provider_acceptance.json \
            > artifacts/live_provider_acceptance.log 2>&1
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          if [ -f artifacts/live_provider_acceptance.json ]; then
            cat artifacts/live_provider_acceptance.json >> "$GITHUB_STEP_SUMMARY"
          else
            tail -n 100 artifacts/live_provider_acceptance.log >> "$GITHUB_STEP_SUMMARY" || true
          fi
          exit 0

      - name: Run read-only BloFin Demo public Futures WebSocket acceptance
        id: blofin_demo_ws
        continue-on-error: true
        run: |
          set +e
          mkdir -p artifacts
          python -m scripts.live_blofin_demo_ws_acceptance \
            --symbol BTC-USDT \
            --duration-seconds 25 \
            --output artifacts/blofin_demo_ws_acceptance.json \
            > artifacts/blofin_demo_ws_acceptance.log 2>&1
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          if [ -f artifacts/blofin_demo_ws_acceptance.json ]; then
            cat artifacts/blofin_demo_ws_acceptance.json >> "$GITHUB_STEP_SUMMARY"
          else
            tail -n 100 artifacts/blofin_demo_ws_acceptance.log >> "$GITHUB_STEP_SUMMARY" || true
          fi
          exit 0

      - name: Download seven months of public BloFin data
        id: download
        continue-on-error: true
        run: |
          set +e
          mkdir -p artifacts
          python -m crypto_super_radar.market_replay \
            --months 7 \
            --db artifacts/blofin_replay.sqlite3 \
            > artifacts/downloader.log 2>&1
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          if [ "$code" -eq 0 ]; then
            echo "Download completed. Dataset must still pass independent inspection." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Download failed; no synthetic data was substituted." >> "$GITHUB_STEP_SUMMARY"
            tail -n 100 artifacts/downloader.log >> "$GITHUB_STEP_SUMMARY" || true
          fi
          exit 0

      - name: Run six-month walk-forward replay
        id: sandbox
        if: steps.download.outputs.exit_code == '0'
        continue-on-error: true
        run: |
          set +e
          python -m crypto_super_radar.ai_sandbox \
            --db artifacts/blofin_replay.sqlite3 \
            --equity 1000 \
            --spread 0.0002 \
            --output artifacts/ai_sandbox_report.json \
            --brain artifacts/trained_brain.json \
            > artifacts/sandbox.log 2>&1
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          if [ "$code" -eq 0 ]; then
            echo "Sandbox process completed; report completeness and dataset validity remain subject to audit." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Sandbox failed closed; no OOS profitability claim is permitted." >> "$GITHUB_STEP_SUMMARY"
            tail -n 100 artifacts/sandbox.log >> "$GITHUB_STEP_SUMMARY" || true
          fi
          exit 0

      - name: Record execution metadata
        if: always()
        run: |
          mkdir -p artifacts
          cat > artifacts/execution_status.json <<JSON
          {
            "workflow": "challenge1-v2-historical-replay",
            "branch": "${GITHUB_REF_NAME}",
            "commit": "${GITHUB_SHA}",
            "provider_acceptance_exit_code": "${{ steps.provider_acceptance.outputs.exit_code }}",
            "blofin_demo_public_ws_acceptance_exit_code": "${{ steps.blofin_demo_ws.outputs.exit_code }}",
            "download_exit_code": "${{ steps.download.outputs.exit_code }}",
            "sandbox_exit_code": "${{ steps.sandbox.outputs.exit_code }}",
            "data_policy": "public BloFin market data only; no credentials; no order writes; no interpolation",
            "spread_policy": "0.0002 modeled spread scenario; not historical order-book spread"
          }
          JSON
          echo "Branch: ${GITHUB_REF_NAME}" >> "$GITHUB_STEP_SUMMARY"
          echo "Commit: ${GITHUB_SHA}" >> "$GITHUB_STEP_SUMMARY"
          echo "Provider acceptance exit code: ${{ steps.provider_acceptance.outputs.exit_code }}" >> "$GITHUB_STEP_SUMMARY"
          echo "BloFin Demo public WS acceptance exit code: ${{ steps.blofin_demo_ws.outputs.exit_code }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Download exit code: ${{ steps.download.outputs.exit_code }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Sandbox exit code: ${{ steps.sandbox.outputs.exit_code }}" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload replay database, logs and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: challenge1-v2-historical-replay
          path: artifacts/
          if-no-files-found: warn
          retention-days: 3
