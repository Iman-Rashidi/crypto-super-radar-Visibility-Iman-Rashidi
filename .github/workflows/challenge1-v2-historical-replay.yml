name: challenge1-v2-historical-replay

on:
  push:
    branches:
      - ops/challenge1-v2-historical-replay

permissions:
  contents: read

concurrency:
  group: challenge1-v2-historical-replay
  cancel-in-progress: false

jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout isolated replay branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install free runner dependencies
        run: python -m pip install --disable-pip-version-check numpy pandas requests

      - name: Compile replay modules
        run: |
          python -m compileall -q \
            crypto_super_radar/market_replay.py \
            crypto_super_radar/ai_sandbox.py \
            crypto_super_radar/virtual_blofin.py \
            crypto_super_radar/challenge1_v2.py \
            crypto_super_radar/adaptive_brain.py

      - name: Run V2 regression and duplicate-timestamp tests
        run: |
          python -m unittest discover -s tests -p 'test_challenge1_v2_time_exit_and_lookahead.py' -v
          python -m unittest discover -s tests -p 'test_challenge1_v2_risk_brain_replay.py' -v
          python -m unittest discover -s tests -p 'test_market_replay_duplicates.py' -v

      - name: Download seven months of public BloFin data
        id: download
        continue-on-error: true
        run: |
          set +e
          mkdir -p artifacts
          python -m crypto_super_radar.market_replay \
            --months 7 \
            --db artifacts/blofin_replay.sqlite3 \
            > artifacts/downloader.log 2>&1
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          if [ "$code" -eq 0 ]; then
            echo "Download completed. Dataset must still pass independent inspection." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Download failed; no synthetic data was substituted." >> "$GITHUB_STEP_SUMMARY"
            tail -n 100 artifacts/downloader.log >> "$GITHUB_STEP_SUMMARY" || true
          fi
          exit 0

      - name: Run six-month walk-forward replay
        id: sandbox
        if: steps.download.outputs.exit_code == '0'
        continue-on-error: true
        run: |
          set +e
          python -m crypto_super_radar.ai_sandbox \
            --db artifacts/blofin_replay.sqlite3 \
            --equity 1000 \
            --spread 0.0002 \
            --output artifacts/ai_sandbox_report.json \
            --brain artifacts/trained_brain.json \
            > artifacts/sandbox.log 2>&1
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          if [ "$code" -eq 0 ]; then
            echo "Sandbox process completed; report completeness and dataset validity remain subject to audit." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Sandbox failed closed; no OOS profitability claim is permitted." >> "$GITHUB_STEP_SUMMARY"
            tail -n 100 artifacts/sandbox.log >> "$GITHUB_STEP_SUMMARY" || true
          fi
          exit 0

      - name: Record execution metadata
        if: always()
        run: |
          mkdir -p artifacts
          cat > artifacts/execution_status.json <<JSON
          {
            "workflow": "challenge1-v2-historical-replay",
            "branch": "${GITHUB_REF_NAME}",
            "commit": "${GITHUB_SHA}",
            "download_exit_code": "${{ steps.download.outputs.exit_code }}",
            "sandbox_exit_code": "${{ steps.sandbox.outputs.exit_code }}",
            "data_policy": "public BloFin market data only; no credentials; no order writes; no interpolation",
            "spread_policy": "0.0002 modeled spread scenario; not historical order-book spread"
          }
          JSON
          echo "Branch: ${GITHUB_REF_NAME}" >> "$GITHUB_STEP_SUMMARY"
          echo "Commit: ${GITHUB_SHA}" >> "$GITHUB_STEP_SUMMARY"
          echo "Download exit code: ${{ steps.download.outputs.exit_code }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Sandbox exit code: ${{ steps.sandbox.outputs.exit_code }}" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload replay database, logs and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: challenge1-v2-historical-replay
          path: artifacts/
          if-no-files-found: warn
          retention-days: 3
