name: challenge1-v2-historical-replay

on:
  push:
    branches:
      - feature/v2-demo-adapter-contract-2026-11-20
      - feature/unified-pattern-intelligence-v3
    paths-ignore:
      - dist/crypto-super-radar-source.tar.xz
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: challenge1-v2-historical-replay-${{ github.ref }}
  cancel-in-progress: true

jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout PR #71 branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install free runner dependencies
        run: python -m pip install --disable-pip-version-check numpy pandas requests

      - name: Compile Replay and V2 modules
        run: |
          python -m compileall -q \
            crypto_super_radar/market_replay.py \
            crypto_super_radar/ai_sandbox.py \
            crypto_super_radar/research_v3_experiments.py \
            crypto_super_radar/virtual_blofin.py \
            crypto_super_radar/challenge1_v2.py \
            crypto_super_radar/adaptive_brain.py \
            tests/test_challenge1_v2_risk_brain_replay.py \
            tests/test_challenge1_v2_time_exit_and_lookahead.py \
            crypto_super_radar/funding_schema_probe.py \
            crypto_super_radar/pattern_intelligence_v3.py \
            tests/test_pattern_intelligence_v3.py

      - name: Run V2 risk, funding, blackout and look-ahead regressions
        run: |
          python -m unittest discover -s tests -p 'test_challenge1_v2_risk_brain_replay.py' -v
          python -m unittest discover -s tests -p 'test_challenge1_v2_time_exit_and_lookahead.py' -v
          python -m unittest discover -s tests -p 'test_pattern_intelligence_v3.py' -v

      - name: Probe live BloFin Demo public funding schema (read-only)
        continue-on-error: true
        run: |
          mkdir -p artifacts
          python -m crypto_super_radar.funding_schema_probe --output artifacts/funding_schema_probe.json
          cat artifacts/funding_schema_probe.json >> "$GITHUB_STEP_SUMMARY"


      - name: Fetch immutable Replay #109 artifact and verify its SQLite hash
        id: replay109
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          mkdir -p artifacts/replay109
          curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/14707189176/zip" \
            -o artifacts/replay109.zip
          code=$?
          if [ "$code" -eq 0 ]; then
            unzip -q artifacts/replay109.zip -d artifacts/replay109
            db=$(find artifacts/replay109 -name 'blofin_replay.sqlite3' -type f | head -1)
            if [ -z "$db" ]; then code=1; else
              actual=$(sha256sum "$db" | awk '{print $1}')
              expected="98420da9742db289c31aef22a414554fb78c0d8285972c2c56509b159d47c9ca"
              if [ "$actual" != "$expected" ]; then
                echo "Replay #109 SHA-256 mismatch: $actual" >&2
                code=1
              else
                cp "$db" artifacts/replay109/replay109_verified.sqlite3
                echo "Replay #109 immutable data hash verified: $actual" >> "$GITHUB_STEP_SUMMARY"
              fi
            fi
          fi
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Download independent five-month dataset with technical indicator pre-roll
        id: download
        continue-on-error: true
        run: |
          set +e
          mkdir -p artifacts
          python -m crypto_super_radar.market_replay \
            --months 6 \
            --start-utc "2025-09-25T00:00:00Z" \
            --funding-start-utc "2025-09-25T00:00:00Z" \
            --end-utc "2026-03-09T00:00:00Z" \
            --db artifacts/independent_5m.sqlite3 \
            > artifacts/downloader.log 2>&1
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          if [ "$code" -eq 0 ]; then
            sha=$(sha256sum artifacts/independent_5m.sqlite3 | awk '{print $1}')
            echo "Independent source range downloaded and hashed: $sha" >> "$GITHUB_STEP_SUMMARY"
            echo "Download: 2025-09-25T00:00:00Z to 2026-03-09T00:00:00Z exclusive." >> "$GITHUB_STEP_SUMMARY"
            echo "Warm-up: 2025-09-25 to 2025-10-25. Unseen scored window: 2025-10-25 to 2026-03-09T00:00:00Z exclusive." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Independent dataset download failed closed; no synthetic candles, prices, funding or interpolation were substituted." >> "$GITHUB_STEP_SUMMARY"
            tail -n 160 artifacts/downloader.log >> "$GITHUB_STEP_SUMMARY" || true
          fi
          exit 0


      - name: Run A-G Replay #109 and independent untouched holdout matrix
        id: research_suite
        if: steps.replay109.outputs.exit_code == '0'
        continue-on-error: true
        run: |
          set +e
          args=(
            --replay109-db artifacts/replay109/replay109_verified.sqlite3
            --output-dir artifacts/v3-research
          )
          if [ "${{ steps.download.outputs.exit_code }}" = "0" ]; then
            args+=(--independent-db artifacts/independent_5m.sqlite3)
            args+=(--independent-start-utc "2025-10-25T00:00:00+00:00")
            args+=(--independent-end-utc "2026-03-09T00:00:00+00:00")
          fi
          python -m crypto_super_radar.research_v3_experiments "${args[@]}" \
            > artifacts/v3-research-execution.log 2>&1
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          cat artifacts/v3-research-execution.log >> "$GITHUB_STEP_SUMMARY" || true
          exit 0

      - name: Record execution metadata
        if: always()
        run: |
          mkdir -p artifacts
          cat > artifacts/execution_status.json <<JSON
          {
            "workflow": "challenge1-v2-historical-replay",
            "branch": "${GITHUB_REF_NAME}",
            "commit": "${GITHUB_SHA}",
            "replay109_artifact_exit_code": "${{ steps.replay109.outputs.exit_code }}",
            "download_exit_code": "${{ steps.download.outputs.exit_code }}",
            "sandbox_exit_code": "NOT_RUN_SEPARATELY; included in A-E research suite",
            "research_suite_exit_code": "${{ steps.research_suite.outputs.exit_code }}",
            "funding_policy": "explicit API Kind=0 or missing-Kind timestamps only at UTC 00:00/08:00/16:00 boundaries ±10s; fixed 8-hour cadence and exact blackout only",
            "funding_schema_probe": "public Demo API history/current funding metadata probe is included in the artifact; current interval is not substituted for historical per-event kind",
            "blackout_policy": "block entries during registered BTC price gaps and post-gap indicator rewarm; BTC positions spanning missing price paths are AMBIGUOUS with no synthetic price or PnL; funding blackouts remain independent",
            "data_policy": "public BloFin Demo market data only; no credentials; no order writes; no synthetic data or interpolation",
            "spread_policy": "0.0002 modelled spread scenario; not historical order-book spread",
            "independent_window": "Download 2025-09-25 to 2026-03-09T00:00Z exclusive; warm-up to 2025-10-25; holdout scored strictly OUT_OF_SAMPLE without training or validation",
            "no_order_writes": true
          }
          JSON
          echo "Branch: ${GITHUB_REF_NAME}" >> "$GITHUB_STEP_SUMMARY"
          echo "Commit: ${GITHUB_SHA}" >> "$GITHUB_STEP_SUMMARY"
          echo "Replay #109 artifact exit code: ${{ steps.replay109.outputs.exit_code }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Downloader exit code: ${{ steps.download.outputs.exit_code }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Independent five-month dataset exit code: ${{ steps.download.outputs.exit_code }}" >> "$GITHUB_STEP_SUMMARY"
          echo "V3 A-E research suite exit code: ${{ steps.research_suite.outputs.exit_code }}" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Replay database, logs and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: challenge1-v2-historical-replay
          path: artifacts/
          if-no-files-found: warn
          retention-days: 7

      - name: Enforce truthful replay and research outcome
        if: always()
        run: |
          failed=0
          if [ "${{ steps.replay109.outputs.exit_code }}" != "0" ]; then
            echo "Replay #109 artifact could not be verified." >> "$GITHUB_STEP_SUMMARY"
            failed=1
          fi
          if [ "${{ steps.download.outputs.exit_code }}" != "0" ]; then
            echo "Independent historical data download failed closed; no five-month result is claimed." >> "$GITHUB_STEP_SUMMARY"
            failed=1
          fi
          if [ "${{ steps.research_suite.outputs.exit_code }}" != "0" ]; then
            echo "A-E V3 research suite did not complete." >> "$GITHUB_STEP_SUMMARY"
            failed=1
          fi
          if [ "$failed" -ne 0 ]; then exit 1; fi
