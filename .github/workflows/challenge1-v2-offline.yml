name: challenge1-v2-offline
on:
  push:
    branches:
      - feature/challenge1-v2-confluence-dynamic-exit
  pull_request:
    branches:
      - feature/challenge1-v2-confluence-dynamic-exit
permissions:
  contents: read
concurrency:
  group: challenge1-v2-offline-${{ github.ref }}
  cancel-in-progress: false
jobs:
  time-exit-and-lookahead:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install offline test dependencies
        run: python -m pip install --disable-pip-version-check numpy pandas requests
      - name: Compile modified modules and tests
        run: |
          python -m compileall -q \
            crypto_super_radar/virtual_blofin.py \
            crypto_super_radar/ai_sandbox.py \
            crypto_super_radar/market_replay.py \
            crypto_super_radar/challenge1_v2.py \
            crypto_super_radar/adaptive_brain.py \
            tests/test_challenge1_v2_time_exit_and_lookahead.py \
            tests/test_challenge1_v2_risk_brain_replay.py
      - name: Test time-exit limit and as-of isolation
        run: |
          python -m unittest discover -s tests \
            -p 'test_challenge1_v2_time_exit_and_lookahead.py' -v
          python -m unittest discover -s tests \
            -p 'test_challenge1_v2_risk_brain_replay.py' -v
