name: gem-hunter-v2-read-only-scan
on:
  workflow_dispatch:
  schedule:
    - cron: "17 */2 * * *"
  push:
    branches:
      - staging/challenge1-integration-2026-11-16
    paths:
      - "crypto_super_radar/gem_hunter_v2.py"
      - ".github/workflows/gem-hunter-v2-read-only-scan.yml"
permissions:
  contents: read
concurrency:
  group: gem-hunter-v2-read-only-scan
  cancel-in-progress: false
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: staging/challenge1-integration-2026-11-16
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install requests turso_serverless
      - name: Run isolated read-only Gem Hunter scan
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
        run: |
          if [[ -z "$TURSO_DATABASE_URL" || -z "$TURSO_AUTH_TOKEN" ]]; then
            echo "::warning::Turso secrets are not configured; scan skipped safely."
            exit 0
          fi
          python -m crypto_super_radar.gem_hunter_v2 --scan
