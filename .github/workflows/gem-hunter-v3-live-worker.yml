name: gem-hunter-v3-live-worker
on:
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"
  push:
    branches:
      - staging/challenge1-integration-2026-11-16
    paths:
      - "crypto_super_radar/gem_hunter_v3.py"
      - "crypto_super_radar/providers.py"
      - "crypto_super_radar/gem_hunter_worker.py"
      - "crypto_super_radar/gem_hunter_discovery.py"
      - ".github/workflows/gem-hunter-v3-live-worker.yml"
permissions:
  contents: read
  id-token: write
concurrency:
  group: gem-hunter-v3-live-worker
  cancel-in-progress: false
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: staging/challenge1-integration-2026-11-16
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install project and worker dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . -r requirements.txt
      - name: Run Gem Hunter V3 on GitHub runner and persist to Turso
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          GEM_HUNTER_TELEGRAM_BOT_TOKEN: ${{ secrets.GEM_HUNTER_TELEGRAM_BOT_TOKEN }}
          GEM_HUNTER_TELEGRAM_CHAT_ID: ${{ secrets.GEM_HUNTER_TELEGRAM_CHAT_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GEM_HUNTER_EXIT_ORDER_USD: "100"
        run: python -m crypto_super_radar.gem_hunter_worker --limit 50
      - name: Verify deployed mobile dashboard reads the Turso snapshot
        env:
          STAGING_URL: https://crypto-super-radar-unlimited-demo-staging.onrender.com
        run: |
          set -euo pipefail
          for attempt in {1..12}; do
            if curl --silent --show-error --fail "$STAGING_URL/health" >/tmp/csr-health.json; then
              break
            fi
            if [[ "$attempt" == "12" ]]; then
              echo "Staging health endpoint did not return HTTP 200."
              exit 1
            fi
            sleep 10
          done
          curl --silent --show-error --fail "$STAGING_URL/api/gem-hunter/v3/latest" >/tmp/gem-hunter-v3-latest.json
          python - <<'PY'
          import json
          with open("/tmp/csr-health.json", encoding="utf-8") as f:
              health = json.load(f)
          with open("/tmp/gem-hunter-v3-latest.json", encoding="utf-8") as f:
              report = json.load(f)
          assert health.get("status") == "ok", health
          assert report.get("report_source") == "TURSO_GITHUB_ACTIONS_WORKER", report
          assert report.get("trade_authorization") == "NO_TRADE", report
          assert isinstance(report.get("candidates"), list), report
          print(json.dumps({
              "health": health.get("status"),
              "report_id": report.get("report_id"),
              "report_source": report.get("report_source"),
              "discovered": report.get("discovered_candidate_count"),
              "tier1": report.get("gem_hunter_v3_tier1_count"),
              "tier2": report.get("gem_hunter_v3_tier2_count"),
              "trade_authorization": report.get("trade_authorization")
          }, ensure_ascii=False))
          PY
