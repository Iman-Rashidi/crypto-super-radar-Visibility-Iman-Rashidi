name: offline-tests
on:
  push:
    branches:
      - main
      - feature/blofin-demo-adapter
      - feature/blofin-demo-learning-memory
      - fix/ch01-analysis-independent-readiness
      - staging/challenge1-integration-2026-11-16
      - feature/github-actions-demo-runner-2026-11-16
      - feature/challenge1-active-supervisors-2026-11-19
  pull_request:
    types: [opened, synchronize, reopened, edited]
    branches:
      - main
      - feature/multi-stage-confirmation-engine
      - feature/blofin-demo-adapter
      - staging/challenge1-integration-2026-11-16
permissions:
  contents: write

# Serialize archive publication for this branch. Concurrent runs used to race
# while pushing the generated Render source bundle to the same Git ref.
concurrency:
  group: csr-render-source-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install numpy pandas requests
      - run: python -m compileall -q crypto_super_radar tests
      - run: python scripts/rebuild_source_archive.py
      - name: Verify Render overlay build and HTTP startup
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/csr-render
          tar -xJf dist/crypto-super-radar-source.tar.xz -C /tmp/csr-render
          cp -R crypto_super_radar/. /tmp/csr-render/crypto-super-radar/crypto_super_radar/
          cp README.md pyproject.toml requirements.txt /tmp/csr-render/crypto-super-radar/
          cd /tmp/csr-render/crypto-super-radar
          python -m pip install -r requirements.txt
          python -m compileall -q .
          PORT=18765 CSR_DB_PATH=/tmp/csr-render/crypto-super-radar/data/csr-test.sqlite3 python -m crypto_super_radar.web_app > /tmp/csr-render/server.log 2>&1 &
          server_pid=$!
          trap 'status=$?; if [[ "$status" -ne 0 ]]; then
            echo "===== Render overlay server.log ====="
            if [[ -f /tmp/csr-render/server.log ]]; then cat /tmp/csr-render/server.log; else echo "server.log missing"; fi
          fi
          kill "$server_pid" 2>/dev/null || true
          exit "$status"' EXIT
          for attempt in $(seq 1 30); do
            if curl --connect-timeout 1 -fsS http://127.0.0.1:18765/health > /tmp/csr-render/health.json; then
              break
            fi
            sleep 0.5
          done
          grep -q '"status":"ok"' /tmp/csr-render/health.json
          curl --connect-timeout 2 -fsS http://127.0.0.1:18765/ > /tmp/csr-render/home.html
          grep -q '۱۲ فیلتر اجباری' /tmp/csr-render/home.html
          curl --connect-timeout 2 -fsS 'http://127.0.0.1:18765/history?asset=cex%3ABTCUSDT' > /tmp/csr-render/history.json
          grep -q 'LOCAL_SQLITE' /tmp/csr-render/history.json
      - name: Repeat Challenge 1 architecture regression suite three times
        shell: bash
        run: |
          set -euo pipefail
          for pass in 1 2 3; do
            echo "===== Challenge 1 regression pass ${pass}/3 ====="
            for test_file in \
              test_elliott_waves.py \
              test_chart_patterns.py \
              test_challenge1_strategy.py \
              test_challenge1_entry_evaluation.py \
              test_ai_second_opinion.py \
              test_web_app.py \
              test_blofin_demo_executor.py \
              test_blofin_demo_private_websocket.py \
              test_challenge1_executor.py \
              test_notion_event_sync.py \
              test_notion_activity_journal.py \
              test_demo_observability.py \
              test_challenge1_position_observers.py \
              test_database.py \
              test_demo_autopilot_once.py; do
              python -m unittest discover -s tests -p "${test_file}" -v
            done
          done
      - name: Verify extracted full source bundle
        run: |
          mkdir -p /tmp/csr-bundle
          tar -xJf dist/crypto-super-radar-source.tar.xz -C /tmp/csr-bundle
          cd /tmp/csr-bundle/crypto-super-radar
          python -m compileall -q .
          PYTHONTRACEMALLOC=5 python -W always::ResourceWarning -m unittest discover -s tests -v
          python -m crypto_super_radar --help
          python -m crypto_super_radar.order_flow_service --help
          python scripts/paper_trading_bot.py --help
      - name: Publish refreshed Render source archive
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          branch="${GITHUB_REF_NAME}"
          git fetch origin "${branch}"
          remote_sha="$(git rev-parse "origin/${branch}")"
          if [[ "${remote_sha}" != "${GITHUB_SHA}" ]]; then
            echo "A newer Staging commit exists (${remote_sha}); this older run will not publish a stale source archive."
            exit 0
          fi
          if git diff --quiet -- dist/crypto-super-radar-source.tar.xz; then
            echo "Render source archive is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist/crypto-super-radar-source.tar.xz
          git commit -m "chore: refresh Render source bundle"
          if ! git push origin "HEAD:${branch}"; then
            echo "Staging advanced during archive publication. The next run for the new HEAD will rebuild and publish the archive."
            exit 0
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: crypto-super-radar-source-bundle
          path: dist/crypto-super-radar-source.tar.xz
          if-no-files-found: error

  streamlit-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install numpy pandas requests "streamlit>=1.40"
      - run: python scripts/rebuild_source_archive.py
      - name: Smoke-test optional Streamlit dashboard
        run: |
          mkdir -p /tmp/csr-streamlit
          tar -xJf dist/crypto-super-radar-source.tar.xz -C /tmp/csr-streamlit
          cp -R crypto_super_radar/. /tmp/csr-streamlit/crypto-super-radar/crypto_super_radar/
          cd /tmp/csr-streamlit/crypto-super-radar
          python -m compileall -q .
          python - <<'PY'
          from streamlit.testing.v1 import AppTest
          app = AppTest.from_file("crypto_super_radar/streamlit_app.py", default_timeout=20).run()
          assert not app.exception, app.exception
          assert any("CRYPTO SUPER RADAR" in item.value for item in app.title)
          assert any("اجرای اسکن پژوهشی" in item.label for item in app.button)
          PY
