name: offline-tests
on:
  push:
    branches:
      - main
      - feature/multi-stage-confirmation-engine
  pull_request:
    types: [opened, synchronize, reopened, edited]
    branches:
      - main
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install numpy pandas requests
      - run: python -m compileall -q crypto_super_radar tests
      - run: python scripts/rebuild_source_archive.py
      - name: Verify extracted full source bundle
        run: |
          mkdir -p /tmp/csr-bundle
          tar -xJf dist/crypto-super-radar-source.tar.xz -C /tmp/csr-bundle
          cd /tmp/csr-bundle/crypto-super-radar
          python -m compileall -q .
          python -m unittest discover -s tests -v
          python -m crypto_super_radar --help
      - uses: actions/upload-artifact@v4
        with:
          name: crypto-super-radar-source-bundle
          path: dist/crypto-super-radar-source.tar.xz
          if-no-files-found: error
