name: Render Demo free keepalive

on:
  push:
    branches: [main]
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: render-demo-free-keepalive
  cancel-in-progress: true

jobs:
  ping-demo:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Wake the BloFin Demo web service
        shell: bash
        run: |
          set -euo pipefail
          curl \
            --fail \
            --silent \
            --show-error \
            --location \
            --retry 2 \
            --retry-delay 10 \
            --retry-all-errors \
            --connect-timeout 15 \
            --max-time 90 \
            https://crypto-super-radar-blofin-demo.onrender.com/health
