name: runner-diagnostic

on:
  push:
    branches:
      - feature/tradingagents-paperbot-integration
      - feature/multi-stage-confirmation-engine
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - main
      - feature/multi-stage-confirmation-engine
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: runner-diagnostic-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  runner-and-offline-tests:
    name: Runner allocation and offline validation
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Confirm runner reached the first step
        shell: bash
        run: |
          set -euo pipefail
          echo "RUNNER_DIAGNOSTIC_STARTED=true"
          echo "runner_os=$RUNNER_OS"
          echo "runner_arch=$RUNNER_ARCH"
          echo "github_ref=$GITHUB_REF"
          echo "github_sha=$GITHUB_SHA"
          date -u
          uname -a

      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up project Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Report Python and dependency contract
        shell: bash
        run: |
          set -euo pipefail
          python --version
          python -m pip --version
          python - <<'PY'
          from pathlib import Path
          import tomllib
          project = tomllib.loads(Path("pyproject.toml").read_text())
          print("requires-python:", project["project"]["requires-python"])
          print("declared-dependencies:", project["project"].get("dependencies", []))
          PY

      - name: Install declared runtime dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt "streamlit>=1.40"

      - name: Compile project and tests
        run: python -m compileall -q crypto_super_radar tests

      - name: Rebuild distributable source bundle
        run: python scripts/rebuild_source_archive.py

      - name: Test extracted bundle
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/csr-diagnostic
          tar -xJf dist/crypto-super-radar-source.tar.xz -C /tmp/csr-diagnostic
          cd /tmp/csr-diagnostic/crypto-super-radar
          python -m compileall -q .
          python -m unittest discover -s tests -v

      - name: Verify CLI entry points
        run: |
          python -m crypto_super_radar --help
          python scripts/paper_trading_bot.py --help

      - name: Smoke-test optional Streamlit dashboard
        run: |
          python - <<'PY'
          from streamlit.testing.v1 import AppTest
          app = AppTest.from_file("crypto_super_radar/streamlit_app.py", default_timeout=20).run()
          assert not app.exception, app.exception
          assert any("CRYPTO SUPER RADAR" in item.value for item in app.title)
          assert any("اجرای اسکن پژوهشی" in item.label for item in app.button)
          PY
