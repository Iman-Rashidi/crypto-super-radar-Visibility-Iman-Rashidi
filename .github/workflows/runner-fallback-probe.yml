name: runner-fallback-probe

on:
  push:
    branches:
      - feature/multi-stage-confirmation-engine
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: runner-fallback-probe-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  allocation-probe:
    name: Hosted runner probe (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-22.04
          - windows-latest
    timeout-minutes: 8
    steps:
      - name: Confirm first-step allocation
        run: |
          echo "RUNNER_DIAGNOSTIC_STARTED=true"
          python -c "import os, platform; print('runner_os=' + os.getenv('RUNNER_OS', '')); print('runner_arch=' + os.getenv('RUNNER_ARCH', '')); print('platform=' + platform.platform()); print('github_sha=' + os.getenv('GITHUB_SHA', ''))"

      - name: Set up project Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Confirm Python 3.14 runtime
        run: |
          python --version
          python -c "import sys; assert sys.version_info[:2] == (3, 14), sys.version"
