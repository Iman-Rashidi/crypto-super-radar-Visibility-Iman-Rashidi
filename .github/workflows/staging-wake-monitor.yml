name: Wake Crypto Super Radar Staging

on:
  push:
    branches:
      - main
  schedule:
    # Stay below Render Free's 15-minute idle threshold.
    # Offset from minute zero because GitHub documents schedule delays at peak load.
    - cron: "4,9,14,19,24,29,34,39,44,49,54,59 * * * *"
  workflow_dispatch:

permissions:
  actions: write
  contents: read

concurrency:
  group: csr-staging-wake-monitor
  cancel-in-progress: true

jobs:
  wake-staging:
    name: Wake and verify Staging health
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Send a read-only health request to Staging
        shell: bash
        env:
          HEALTH_URL: https://crypto-super-radar-unlimited-demo-staging.onrender.com/health
        run: |
          set -euo pipefail
          echo "Checking only the Crypto Super Radar Staging health endpoint."
          response="$(curl \
            --fail \
            --silent \
            --show-error \
            --retry 2 \
            --retry-all-errors \
            --retry-delay 5 \
            --connect-timeout 15 \
            --max-time 70 \
            --user-agent "CSR-Staging-Wake-Monitor/1.0" \
            "$HEALTH_URL")"
          printf '%s\n' "$response"
          python -c 'import json,sys; data=json.load(sys.stdin); assert data.get("status") == "ok", f"Unexpected health response: {data!r}"; print("Staging health check: PASS")' <<< "$response"

      - name: Verify the mobile dashboard page and independent AI configuration
        shell: bash
        env:
          BASE_URL: https://crypto-super-radar-unlimited-demo-staging.onrender.com
        run: |
          set -euo pipefail
          dashboard="$(curl --fail --silent --show-error --connect-timeout 15 --max-time 45 "$BASE_URL/")"
          grep -q 'blofin-v2-run-once' <<< "$dashboard"
          echo "Staging dashboard page and V2 panel: PASS"
          ai_status="$(curl --fail --silent --show-error --connect-timeout 15 --max-time 45 "$BASE_URL/api/ai/challenge1-status")"
          python -c 'import json,sys; p=json.load(sys.stdin); s=p.get("second_supervisor") or {}; assert s.get("configured") is True, s.get("configuration_issues"); assert s.get("provider") == "Groq", s; assert s.get("model") == "openai/gpt-oss-120b", s; print(json.dumps({"configured":s.get("configured"),"provider":s.get("provider"),"model":s.get("model"),"status":"PASS"}))' <<< "$ai_status"

      - name: One-time guarded V2 Demo verification dispatch after refreshed Staging worker
        if: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[run-v2-demo-verification]') }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh api --method POST "repos/${GH_REPO}/actions/workflows/challenge1-v2-demo-autopilot.yml/dispatches" \
            -f ref=staging/challenge1-integration-2026-11-16

# V2 guarded Demo verification after Groq config fix and Turso read-back validation.
