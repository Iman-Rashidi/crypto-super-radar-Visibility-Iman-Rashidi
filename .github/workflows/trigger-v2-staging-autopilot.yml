name: trigger-v2-staging-autopilot

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  actions: write
  contents: read

concurrency:
  group: trigger-v2-staging-autopilot
  cancel-in-progress: false

jobs:
  dispatch-staging:
    if: ${{ vars.CHALLENGE_1_V2_DEMO_AUTOPILOT_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Dispatch the Staging V2 workflow
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh api --method POST "repos/${GH_REPO}/actions/workflows/challenge1-v2-demo-dry-run-autopilot.yml/dispatches" \
            -f ref=staging/challenge1-integration-2026-11-16
