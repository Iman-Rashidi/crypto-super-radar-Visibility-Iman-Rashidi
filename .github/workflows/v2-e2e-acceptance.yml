name: V2 E2E component acceptance (one-shot Demo)

on:
  push:
    branches:
      - staging/challenge1-integration-2026-11-16

permissions:
  contents: read

concurrency:
  group: v2-e2e-acceptance-one-shot
  cancel-in-progress: false

jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
      TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
      BLOFIN_DEMO_TRADING_ENABLED: 'true'
      BLOFIN_DEMO_TRADE_API_KEY: ${{ secrets.BLOFIN_DEMO_TRADE_API_KEY }}
      BLOFIN_DEMO_TRADE_API_SECRET: ${{ secrets.BLOFIN_DEMO_TRADE_API_SECRET }}
      BLOFIN_DEMO_TRADE_PASSPHRASE: ${{ secrets.BLOFIN_DEMO_TRADE_PASSPHRASE }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      CSR_ACCEPTANCE_REPORT: ${{ runner.temp }}/v2-e2e-acceptance-report.json
    steps:
      - name: Checkout exact Staging commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install project dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Compile acceptance code
        run: python -m compileall -q crypto_super_radar scripts/v2_e2e_acceptance.py
      - name: Verify required one-shot credentials exist without printing them
        shell: bash
        run: |
          set -euo pipefail
          for name in TURSO_DATABASE_URL TURSO_AUTH_TOKEN BLOFIN_DEMO_TRADE_API_KEY BLOFIN_DEMO_TRADE_API_SECRET BLOFIN_DEMO_TRADE_PASSPHRASE TELEGRAM_BOT_TOKEN; do
            if [[ -z "${!name:-}" ]]; then
              echo "Required secret is missing: ${name}" >&2
              exit 1
            fi
          done
      - name: Execute one-shot live component acceptance
        run: python -m scripts.v2_e2e_acceptance
      - name: Upload non-secret acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v2-e2e-acceptance-${{ github.run_id }}
          path: ${{ runner.temp }}/v2-e2e-acceptance-report.json
          if-no-files-found: ignore
          retention-days: 30
