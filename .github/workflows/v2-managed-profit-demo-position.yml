name: V2 managed-profit Demo position (one-shot)

on:
  push:
    branches:
      - staging/challenge1-integration-2026-11-16
    paths:
      - ".github/workflows/v2-managed-profit-demo-position.yml"
      - "scripts/v2_managed_profit_demo_position.py"
      - "crypto_super_radar/blofin_demo_executor.py"
      - "crypto_super_radar/challenge1_v2_autopilot.py"
      - "crypto_super_radar/challenge1_v2_orchestration.py"
      - "crypto_super_radar/telegram_notifier.py"
      - "crypto_super_radar/web_app.py"
      - "tests/test_blofin_demo_executor.py"
      - "tests/test_challenge1_v2_autopilot.py"
      - "tests/test_challenge1_v2_web_orchestration.py"
      - "tests/test_v2_managed_profit_demo_position.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v2-managed-profit-demo-position
  cancel-in-progress: false

jobs:
  managed-demo-position:
    if: ${{ github.event_name != 'push' || !contains(github.event.head_commit.message, '[skip-v2-demo]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
      TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
      BLOFIN_DEMO_TRADING_ENABLED: "true"
      BLOFIN_DEMO_AUTOPILOT_ENABLED: "false"
      BLOFIN_DEMO_SMOKE_TEST_ENABLED: "false"
      CHALLENGE_1_V2_DEMO_AUTOPILOT_ENABLED: "true"
      BLOFIN_DEMO_TRADE_API_KEY: ${{ secrets.BLOFIN_DEMO_TRADE_API_KEY }}
      BLOFIN_DEMO_TRADE_API_SECRET: ${{ secrets.BLOFIN_DEMO_TRADE_API_SECRET }}
      BLOFIN_DEMO_TRADE_PASSPHRASE: ${{ secrets.BLOFIN_DEMO_TRADE_PASSPHRASE }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
    steps:
      - name: Checkout exact Staging commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Compile managed Demo runner and V2 executor
        run: python -m compileall -q scripts/v2_managed_profit_demo_position.py crypto_super_radar tests/test_v2_managed_profit_demo_position.py tests/test_blofin_demo_executor.py
      - name: Run Top-1, SL-only, TP1 and Time Exit regression tests
        env:
          BLOFIN_DEMO_TRADING_ENABLED: "false"
          CHALLENGE_1_V2_DEMO_AUTOPILOT_ENABLED: "false"
        run: |
          python -m unittest discover -s tests -p 'test_v2_managed_profit_demo_position.py' -v
          python -m unittest discover -s tests -p 'test_blofin_demo_executor.py' -v
          python -m unittest discover -s tests -p 'test_challenge1_v2_autopilot.py' -v
          python -m unittest discover -s tests -p 'test_challenge1_v2_web_orchestration.py' -v
      - name: Verify Demo-only credentials exist without printing them
        shell: bash
        run: |
          set -euo pipefail
          for name in TURSO_DATABASE_URL TURSO_AUTH_TOKEN BLOFIN_DEMO_TRADE_API_KEY BLOFIN_DEMO_TRADE_API_SECRET BLOFIN_DEMO_TRADE_PASSPHRASE GROQ_API_KEY TELEGRAM_BOT_TOKEN; do
            if [[ -z "${!name:-}" ]]; then
              echo "Required secret is missing: ${name}" >&2
              exit 1
            fi
          done
      - name: Execute the permanent-idempotency Top-1 V2 Demo position
        shell: bash
        run: |
          set -euo pipefail
          python -m scripts.v2_managed_profit_demo_position | tee "${RUNNER_TEMP}/v2-managed-profit-demo-position.json"
      - name: Upload non-secret position evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v2-managed-profit-demo-position-${{ github.run_id }}
          path: ${{ runner.temp }}/v2-managed-profit-demo-position.json
          if-no-files-found: ignore
          retention-days: 30
